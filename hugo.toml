# ============================================================
#  站点基础配置
#  baseURL 必须是带协议与结尾斜杠的完整地址，影响 canonical / RSS / 站点地图
# ============================================================
baseURL = "https://www.handejun.com/"
title = "汉德君的博客"
locale = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
summaryLength = 60
theme = "PaperMod"

[pagination]
  pagerSize = 8

# ------------------------------------------------------------
#  站点参数
# ------------------------------------------------------------
[params]
  env = "production"
  description = "汉德君的博客 —— 14 年信息化与数字化管理实践，记录技术战略、AI 落地与团队治理。"
  author = "汉德君"
  keywords = ["信息化", "数字化转型", "技术管理", "CTO", "CIO", "人工智能", "网络安全", "等保合规"]
  defaultTheme = "dark"          # auto / light / dark
  mainSections = ["posts"]

  # 阅读体验
  ShowReadingTime = true
  ShowWordCount = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true                 # 文章目录
  TocOpen = false                # 目录默认折叠
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  hideFooter = false

  # 归档页只展示文章（设为 true 会额外包含关于等单页）
  ShowAllPagesInArchive = false

  # 顶栏 Logo：文字 + 内联 SVG 图标
  [params.label]
    text = "汉德君的博客"
    iconSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.6l2.3 8.1 8.1 2.3-8.1 2.3L12 22.4l-2.3-8.1L1.6 12l8.1-2.3z"/></svg>'

  # 首页 Hero 文案
  [params.hero]
    eyebrow = "CTO / CIO · DIGITAL TRANSFORMATION · AI"
    title = "把复杂的信息化，"
    titleAccent = "做成可复用的能力"
    description = "14 年信息化与数字化管理经验，历任集团信息化负责人、科技公司副总经理。在这里记录技术战略、AI 落地、安全合规与团队治理的实践。"

  # 社交图标
  [[params.socialIcons]]
    name = "email"
    url = "mailto:592568992@qq.com"
  [[params.socialIcons]]
    name = "rss"
    url = "https://www.handejun.com/index.xml"

  # favicon 等静态资源
  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"
    theme_color = "#101318"
    msapplication_TileColor = "#101318"

  # 站内搜索（Fuse.js）
  [params.fuseOpts]
    isCaseSensitive = false
    ignoreDiacritics = true
    includeScore = true
    includeMatches = false
    minMatchCharLength = 1
    shouldSort = true
    findAllMatches = false
    threshold = 0.4
    location = 0
    distance = 100
    maxPatternLength = 32
    keys = ["title", "permalink", "summary", "content"]

# ------------------------------------------------------------
#  导航菜单
# ------------------------------------------------------------
[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 20

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 40

# ------------------------------------------------------------
#  输出格式：home 额外输出 JSON 供站内搜索使用
# ------------------------------------------------------------
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ------------------------------------------------------------
#  Markdown 渲染
# ------------------------------------------------------------
[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
    guessSyntax = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
